<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=['#7c5cff','#00b8d9','#ff3d8b','#ffb020','#2de28b','#ff6a3d','#4d8bff','#c24dff'];
const PRE={
'¿Qué jugamos?':['Free Fire','Fortnite','Minecraft','Valorant','Call of Duty','GTA V','Roblox','League of Legends','Among Us','Rocket League','Apex Legends','EA FC'],
'Retos gamer':['Ganar sin morir','Solo pistola','Sin usar mapa','Partida con los ojos entrecerrados','Jugar con la mano contraria','Top 3 obligatorio','10 kills o castigo','Sin hablar en toda la partida'],
'Castigos':['Mandar un audio cantando','Cambiar la foto de perfil 24h','Jugar la próxima con teclado en la espalda','Invitar la próxima ronda','Apodo ridículo por 1 día','Hacer 15 sentadillas','Hablar en rima 10 min','Dejar que otro juegue tu cuenta 1 partida'],
'Quién empieza':['Jugador 1','Jugador 2','Jugador 3','Jugador 4'],
'Roles':['Tanque','Support','Asesino','Francotirador','Rusher','Estratega'],
'Sí / No':['Sí','No','Sí*1','No*1'],
'Quién paga':['Pierde Jugador 1','Pierde Jugador 2','Pierde Jugador 3','Pagan todos']
};
PRE['Sí / No']=['Sí','No'];
const RET={
'🟢 Fácil':['Ganá una partida sin usar la mochila','Hacé 3 kills seguidas','Jugá una ronda con sensibilidad al máximo','Terminá la partida sin curarte','Usá solo un arma toda la partida','Hablá como narrador deportivo toda la ronda','Jugá con el brillo al mínimo'],
'🟡 Medio':['Ganá sin recibir un solo headshot','Quedá top 1 usando solo armas blancas','Cero muertes en 2 partidas seguidas','Ganá una partida con la pantalla invertida','Hacé 10 kills sin usar granadas','Jugá una ronda con el sonido apagado','Ganá desde el primer spawn sin moverte 10 segundos'],
'🔴 Extremo':['Ganá 3 partidas seguidas sin morir','Top 1 con la mano no dominante','Ganá usando solo la skin más fea','Speedrun: ganar en menos de 5 minutos','Ganá con los ojos cerrados los primeros 30s','Dos victorias seguidas jugando con el control del revés'],
'💀 Castigo':['Cantá el himno del juego','Mandá un meme al último chat','Postea "perdí" en tus historias','Hacé un baile y que lo vean todos','Cambiá tu nombre de usuario por 24h','Lavá los platos del próximo stream'],
'🤝 Cooperativo':['Ganen sin que nadie muera','Usen solo un arma entre todos','Ganen sin hablar','Cada uno juega con un rol distinto','Ganen con el mismo personaje todos','Ganen sin tocar el chat de voz']
};
const K='nexora_ruleta_v1';
let S={name:'¿Qué jugamos?',items:[],elim:false,dur:6,snd:true,players:['Jugador 1','Jugador 2','Jugador 3'],pts:{},hist:[],saved:{},ok:0,ko:0,st:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.items.length)S.items=parse(PRE['¿Qué jugamos?'].join('\n'));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function parse(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\*(\d+)$/);return m&&m[1]?{t:m[1].trim(),w:Math.min(20,Math.max(1,+m[2]))}:{t:l,w:1}})}
const toTxt=it=>it.map(o=>o.t+(o.w>1?'*'+o.w:'')).join('\n');
const cv=$('#w'),cx=cv.getContext('2d');let rot=0,spinning=false;
function draw(){
 const n=S.items.length,R=cv.width/2,r=R-14;cx.clearRect(0,0,cv.width,cv.height);
 cx.save();cx.translate(R,R);
 cx.beginPath();cx.arc(0,0,R-4,0,7);cx.fillStyle='#1b1838';cx.fill();
 if(!n){cx.restore();cx.fillStyle='#8e89b8';cx.font='bold 36px sans-serif';cx.textAlign='center';cx.fillText('Agregá opciones',R,R);return}
 const tw=S.items.reduce((a,o)=>a+o.w,0);let a=-Math.PI/2+rot;
 S.items.forEach((o,i)=>{const s=o.w/tw*Math.PI*2;
  cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,r,a,a+s);cx.closePath();cx.fillStyle=PAL[i%PAL.length];if(n>1&&n%PAL.length===1&&i===n-1)cx.fillStyle='#ffb020';cx.fill();cx.strokeStyle='#07060f';cx.lineWidth=3;cx.stroke();
  cx.save();cx.rotate(a+s/2);cx.fillStyle='#fff';cx.textAlign='right';cx.textBaseline='middle';
  const fs=Math.max(18,Math.min(44,Math.round(r*Math.min(s,1.2)*.42)));cx.font='bold '+fs+'px system-ui,sans-serif';cx.shadowColor='#0008';cx.shadowBlur=4;
  let t=o.t;const mx=r*.58;while(t.length>2&&cx.measureText(t).width>mx)t=t.slice(0,-2);if(t!==o.t)t+='…';
  cx.fillText(t,r-24,0);cx.restore();a+=s});
 cx.beginPath();cx.arc(0,0,r,0,7);cx.strokeStyle='#7c5cff';cx.lineWidth=6;cx.stroke();
 cx.restore();
}
function pick(){const tw=S.items.reduce((a,o)=>a+o.w,0);let x=Math.random()*tw,i=0;for(;i<S.items.length-1;i++){x-=S.items[i].w;if(x<0)break}return i}
function under(rr){const tw=S.items.reduce((a,o)=>a+o.w,0);let p=((-rr)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),c=0;for(let i=0;i<S.items.length;i++){c+=S.items[i].w/tw*Math.PI*2;if(p<c)return i}return 0}
let AC;function tick(){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=700;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.05);o.stop(AC.currentTime+.06)}catch(e){}}
function spin(){
 if(spinning||S.items.length<1)return;if(S.items.length===1){finish(0);return}
 spinning=true;$('#spin').disabled=true;
 const w=pick(),tw=S.items.reduce((a,o)=>a+o.w,0);let st=0;for(let i=0;i<w;i++)st+=S.items[i].w/tw*Math.PI*2;
 const sl=S.items[w].w/tw*Math.PI*2,pt=st+sl*(.1+Math.random()*.8),tau=Math.PI*2;
 const from=rot,fin=from+tau*(5+S.dur)+((((-pt-from)%tau)+tau)%tau),D=S.dur*1000,t0=performance.now();let last=under(from);
 (function f(now){const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,4);rot=from+(fin-from)*e;draw();const u=under(rot);if(u!==last){tick();last=u}
  if(p<1)requestAnimationFrame(f);else{rot=fin%tau;spinning=false;$('#spin').disabled=false;finish(w)}})(t0);
}
function finish(i){const t=S.items[i].t;S.hist.unshift({t,w:S.name,d:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})});S.hist=S.hist.slice(0,60);
 $('#mres').textContent=t;$('#last').innerHTML='Último: <b>'+esc(t)+'</b>';$('#modal').classList.add('on');confetti();
 if(S.elim){S.items.splice(i,1);$('#txt').value=toTxt(S.items);}
 save();rend();draw()}
$('#spin').onclick=spin;$('#again').onclick=()=>{$('#modal').classList.remove('on');setTimeout(spin,150)};$('#mclose').onclick=()=>$('#modal').classList.remove('on');
function confetti(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+3,c:PAL[Math.random()*8|0],l:1}));
 (function f(){x.clearRect(0,0,c.width,c.height);let al=0;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l-=.011;if(p.l>0){al=1;x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)}});if(al)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function setItems(arr,name){S.items=typeof arr==='string'?parse(arr):arr;if(name){S.name=name;$('#wname').value=name}$('#txt').value=toTxt(S.items);save();rend();draw()}
function rend(){
 $('#cnt').textContent=S.items.length+' opciones';
 $('#score').innerHTML=S.players.map((p,i)=>`<div><span>${esc(p)}</span><span class="pts"><button class="btn" data-s="${i}" data-d="-1">−</button><b>${S.pts[p]||0}</b><button class="btn" data-s="${i}" data-d="1">+</button></span></div>`).join('')||'<div>Sin jugadores</div>';
 $('#saved').innerHTML=Object.keys(S.saved).map(k=>`<div><span>${esc(k)} <small style="color:var(--mu)">(${S.saved[k].length})</small></span><span><button class="btn" data-ld="${esc(k)}">Cargar</button> <button class="btn d" data-dl="${esc(k)}">✕</button></span></div>`).join('')||'<div style="color:var(--mu)">Todavía no guardaste ninguna</div>';
 $('#hist').innerHTML=S.hist.map(h=>`<div><span><b>${esc(h.t)}</b> <small style="color:var(--mu)">· ${esc(h.w)}</small></span><small>${h.d}</small></div>`).join('')||'<div style="color:var(--mu)">Sin tiradas aún</div>';
 $('#sOk').textContent=S.ok;$('#sKo').textContent=S.ko;$('#sSt').textContent=S.st;
}
// UI
$('#pre').innerHTML=Object.keys(PRE).map(k=>`<option>${k}</option>`).join('');
$('#lvl').innerHTML=Object.keys(RET).map(k=>`<option>${k}</option>`).join('');
$('#loadpre').onclick=()=>setItems(PRE[$('#pre').value].join('\n'),$('#pre').value);
$('#clr').onclick=()=>setItems([], 'Mi ruleta');
$('#txt').oninput=e=>{S.items=parse(e.target.value);save();rend();draw()};
$('#wname').oninput=e=>{S.name=e.target.value;save()};
$('#shuf').onclick=()=>{for(let i=S.items.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.items[i],S.items[j]]=[S.items[j],S.items[i]]}setItems(S.items)};
$('#elim').onchange=e=>{S.elim=e.target.checked;save()};$('#snd').onchange=e=>{S.snd=e.target.checked;save()};
$('#dur').oninput=e=>{e.target.style.setProperty('--p',(e.target.value-2)/13*100+'%');S.dur=+e.target.value;$('#dv').textContent=S.dur;save()};
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.pg').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p))});
// retos
let cur='',tI;const rnd=a=>a[Math.random()*a.length|0];
$('#rnew').onclick=()=>{cur=rnd(RET[$('#lvl').value]);$('#rbox').textContent=cur};
$('#rwheel').onclick=()=>setItems(RET[$('#lvl').value].join('\n'),'Retos '+$('#lvl').value);
$$('[data-t]').forEach(b=>b.onclick=()=>{clearInterval(tI);let t=+b.dataset.t;const sh=()=>$('#tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');sh();tI=setInterval(()=>{t--;sh();if(t<=0){clearInterval(tI);$('#tm').textContent='⏰ ¡Tiempo!';tick();tick()}},1000)});
$('#rok').onclick=()=>{S.ok++;S.st++;save();rend()};$('#rko').onclick=()=>{S.ko++;S.st=0;save();rend()};
// amigos
$('#pl').value=S.players.join('\n');
$('#plsave').onclick=()=>{S.players=$('#pl').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);save();rend()};
$('#plwheel').onclick=()=>{$('#plsave').click();setItems(S.players.map(t=>({t,w:1})),'Turnos')};
$('#score').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const p=S.players[+b.dataset.s];S.pts[p]=(S.pts[p]||0)+ +b.dataset.d;save();rend()};
$('#sreset').onclick=()=>{S.pts={};save();rend()};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
$$('[data-m]').forEach(b=>b.onclick=()=>{$('#plsave').click();const P=shuffle(S.players),m=b.dataset.m,B=$('#mbox');
 if(P.length<2&&m!=='loser'){B.textContent='Necesitás al menos 2 jugadores';return}
 if(m==='duel')B.innerHTML=`⚔️ ${esc(P[0])} vs ${esc(P[1])}<br><small>${esc(rnd(RET['🟡 Medio']))}</small>`;
 if(m==='team'){const h=Math.ceil(P.length/2);B.innerHTML=`🔵 ${esc(P.slice(0,h).join(', '))}<br>🔴 ${esc(P.slice(h).join(', '))}`}
 if(m==='loser')B.innerHTML=`💀 ${esc(P[0]||'?')}<br><small>${esc(rnd(PRE['Castigos']))}</small>`;
 if(m==='order')B.innerHTML=P.map((p,i)=>`${i+1}. ${esc(p)}`).join('<br>')});
// guardadas
$('#save').onclick=()=>{const n=($('#sname').value||S.name).trim();if(!n)return;S.saved[n]=S.items;$('#sname').value='';save();rend()};
$('#saved').onclick=e=>{const l=e.target.dataset.ld,d=e.target.dataset.dl;if(l&&S.saved[l])setItems(JSON.parse(JSON.stringify(S.saved[l])),l);if(d){delete S.saved[d];save();rend()}};
$('#exp').onclick=async()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,i:S.items}))));try{await navigator.clipboard.writeText(c);$('#exp').textContent='✅ Copiado'}catch(e){prompt('Copiá este código:',c)}setTimeout(()=>$('#exp').textContent='📋 Copiar código',1500)};
$('#impb').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));setItems(d.i.map(o=>({t:String(o.t),w:+o.w||1})),d.n);$('#imp').value=''}catch(e){alert('Código inválido')}};
$('#hclr').onclick=()=>{S.hist=[];save();rend()};
$('#wname').value=S.name;$('#elim').checked=S.elim;$('#snd').checked=S.snd;$('#dur').value=S.dur;$('#dur').style.setProperty('--p',(S.dur-2)/13*100+'%');$('#dv').textContent=S.dur;$('#txt').value=toTxt(S.items);
rend();draw();
</script>
</body>
</html>
